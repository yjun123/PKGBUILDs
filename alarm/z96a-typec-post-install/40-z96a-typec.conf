# Early-load the drivers needed for the RTC and the eDP display so the boot
# console appears before the root filesystem is mounted.
#
#   rtc_rk808                - Rockchip RK808 RTC (avoids journal corruption)
#   rockchipdrm              - Rockchip DRM/KMS driver (pulls analogix_dp,
#                              dw-dp, dw-hdmi, … in as dependencies)
#   panel_edp                - eDP panel driver (no dependencies, nothing pulls it)
#   phy_rockchip_naneng_edp  - eDP PHY (no dependencies, nothing pulls it; without
#                              it the display pipeline cannot complete early)
#
# NOTE: this file overrides the entire MODULES list in /etc/mkinitcpio.conf;
# add any of your own modules here as well if needed.
MODULES=(rtc_rk808 rockchipdrm panel_edp phy_rockchip_naneng_edp)
