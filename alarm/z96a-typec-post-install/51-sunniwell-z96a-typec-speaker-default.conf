# Make the internal speaker the default output on the Z96A (Type-C).
#
# The HDMI and the speaker sink both come up with priority.session = 1000,
# so which of them becomes the default is a race. Bump the speaker above
# HDMI so that it is picked whenever WirePlumber recomputes the default
# node (at boot, on HDMI hotplug, or when the current default disappears).
#
# Rules from several fragments are concatenated, so this does not affect
# the rules shipped in alsa-vm.conf.
#
# node.name is derived from the DT machine driver (platform-rk809-sound)
# and the UCM profile/device path (HiFi / Speaker).

monitor.alsa.rules = [
  {
    matches = [
      {
        node.name = "alsa_output.platform-rk809-sound.HiFi__Speaker__sink"
      }
    ]
    actions = {
      update-props = {
        priority.session = 1500
      }
    }
  }
]
